<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noxelyra Music</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.3" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 6.2v11.6a.9.9 0 0 0 1.4.75L15 12.75a.9.9 0 0 0 0-1.5L6.4 5.45A.9.9 0 0 0 5 6.2Z" fill="currentColor"/><rect x="16.5" y="5" width="2.6" height="14" rx="1.1" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><g transform="matrix(-1 0 0 1 24 0)"><path d="M5 6.2v11.6a.9.9 0 0 0 1.4.75L15 12.75a.9.9 0 0 0 0-1.5L6.4 5.45A.9.9 0 0 0 5 6.2Z" fill="currentColor"/><rect x="16.5" y="5" width="2.6" height="14" rx="1.1" fill="currentColor"/></g></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.6l2.4 4.8C14.3 16 15.5 17 17.5 17H21M3 17h3.5c1.4 0 2.4-.5 3.2-1.4M14.3 8.4C15.1 7.5 16.1 7 17.5 7H21M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H19m-3-3 3 3-3 3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H5m3 3-3-3 3-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z" fill="currentColor"/><path d="m16 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-stage" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 20.5h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-away" viewBox="0 0 24 24"><rect x="2.5" y="6" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M17 11.5h5m-2-2.5 2.5 2.5L20 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l2-1.5-2-3.4-2.3 1a7.6 7.6 0 0 0-2.6-1.5L14.2 2.6h-4.4L9.5 5.1a7.6 7.6 0 0 0-2.6 1.5l-2.3-1-2 3.4 2 1.5a7.7 7.7 0 0 0 0 3l-2 1.5 2 3.4 2.3-1a7.6 7.6 0 0 0 2.6 1.5l.3 2.5h4.4l.3-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3 1 2-3.4-2-1.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18.5V6.2l11-2.2v12.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.5" cy="18.5" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16.2" r="2.5" fill="currentColor"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 4v16M17 4v16M3 9h4m10 0h4M3 15h4m10 0h4" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.7l2 2.2h7.3A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h10" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.3A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z" fill="currentColor"/></symbol>
  </svg>

  <!-- Mini oynatıcı şeridi: sürükle taşı, tıkla geri dön. Oynatıcının üstüne değil, üstündeki ayrı şeride yerleşir. -->
  <div id="minibar" class="minibar" title="Sürükleyerek taşı · tıklayınca pencereye dön">
    <svg class="logo"><use href="#i-moon"/></svg><span id="mini-title">Noxelyra Music</span>
  </div>

  <header class="titlebar">
    <div class="brand"><svg class="logo"><use href="#i-moon"/></svg><span id="app-name">Noxelyra Music</span></div>
    <label class="search">
      <svg><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Ara" autocomplete="off" spellcheck="false">
    </label>
  </header>

  <aside class="sidebar">
    <nav id="nav"></nav>
    <div class="side-title" id="side-title"></div>
    <div id="side-list" class="side-list"></div>
    <button class="side-item settings-link" data-view="settings"><svg><use href="#i-gear"/></svg><span>Ayarlar</span></button>
  </aside>

  <main class="content">
    <section id="view-list" class="view">
      <div class="list-head">
        <div>
          <h1 id="list-title">Kitaplık</h1>
          <p id="list-sub" class="muted"></p>
        </div>
        <div class="list-actions" id="list-actions"></div>
      </div>
      <div id="panel" class="panel"></div>
      <div class="rows-head" id="rows-head"><span>#</span><span>Başlık</span><span>Sanatçı</span><span>Albüm</span><span class="r">Süre</span></div>
      <div id="rows" class="rows" tabindex="0"><div id="rows-spacer"></div></div>
      <div id="empty" class="empty"></div>
    </section>

    <section id="view-settings" class="view hidden"></section>

    <div id="stage" class="stage idle">
      <video id="video" playsinline preload="auto"></video>
      <div id="yt-host"><div id="yt-player"></div></div>
      <div id="stage-art" class="stage-art">
        <div class="art-big" id="art-big"></div>
        <div class="stage-text"><h2 id="stage-title"></h2><p id="stage-artist" class="muted"></p></div>
      </div>
      <button id="stage-close" class="stage-close" title="Listeye dön (Esc)">Listeye dön</button>
    </div>
  </main>

  <footer class="playerbar">
    <div class="now">
      <div class="art-small" id="art-small"><svg><use href="#i-note"/></svg></div>
      <div class="now-text">
        <div id="now-title" class="now-title">Bir şey çalmıyor</div>
        <div id="now-artist" class="now-artist muted"></div>
      </div>
      <button id="attribution" class="chip hidden" title="Kaynakta aç"></button>
    </div>
    <div class="center">
      <div class="controls">
        <button id="btn-shuffle" class="icon small" title="Karıştır"><svg><use href="#i-shuffle"/></svg></button>
        <button id="btn-prev" class="icon" title="Önceki"><svg><use href="#i-prev"/></svg></button>
        <button id="btn-play" class="icon play" title="Oynat (Boşluk)"><svg><use href="#i-play"/></svg></button>
        <button id="btn-next" class="icon" title="Sonraki"><svg><use href="#i-next"/></svg></button>
        <button id="btn-repeat" class="icon small" title="Tekrar: kapalı"><svg><use href="#i-repeat"/></svg><b id="repeat-one" class="hidden">1</b></button>
      </div>
      <div class="seek">
        <span id="pos" class="time">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Konum">
        <span id="dur" class="time">0:00</span>
      </div>
    </div>
    <div class="right">
      <button id="btn-stage" class="icon small" title="Oynatıcı sahnesi"><svg><use href="#i-stage"/></svg></button>
      <button id="btn-away" class="icon small" title="Arka plana al (pencereyi ekran dışına taşır)"><svg><use href="#i-away"/></svg></button>
      <button id="btn-mute" class="icon small" title="Sessiz"><svg><use href="#i-vol"/></svg></button>
      <input id="volume" type="range" min="0" max="100" value="80" aria-label="Ses">
    </div>
  </footer>

  <div id="toast" class="toast"></div>
  <div id="drop" class="drop hidden">Bırak, çalsın</div>
  <script type="module" src="app.js"></script>
</body>
</html>
